name: Codex ForgeMCP Live Effects Pass

on:
  push:
    branches:
      - forgemcp-live-effects-pass
    paths:
      - 'docs/CODEX_LIVE_EFFECTS_PASS.md'
      - '.github/workflows/codex-live-effects.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-forgemcp-live-effects
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout live-effects branch
        uses: actions/checkout@v4
        with:
          ref: forgemcp-live-effects-pass
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate and mask OpenAI API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi
          echo "::add-mask::$OPENAI_API_KEY"
          echo "::add-mask::$CODEX_API_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Codex CLI
        run: npm install -g @openai/codex@0.148.0

      - name: Execute Codex live-effects task
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          codex exec \
            --dangerously-bypass-approvals-and-sandbox \
            --skip-git-repo-check \
            "$(cat docs/CODEX_LIVE_EFFECTS_PASS.md)"

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
          npm run lint

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ForgeMCP Codex"
          git config user.email "actions@users.noreply.github.com"
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo "Codex produced no tracked changes."
            exit 1
          fi
          git add -A
          git commit -m "feat: add visible Terra Cube and visual live effects"
          git push origin HEAD:forgemcp-live-effects-pass
