name: Chrome WebMCP smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-webmcp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Show Chrome version
        run: google-chrome --version
      - name: Live Cube direct-guest entry smoke
        shell: bash
        run: |
          set -euo pipefail
          CUBE_URL='https://teslaeco.github.io/Cube-Chess-512-AI-Open-Source-3D-Chess-Engine-Autonomous-AI-Game-Developer/?guest=1'
          DOM="$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$CUBE_URL" 2>/tmp/cube-guest-chrome.log)"
          printf '%s' "$DOM" | grep -q 'data-auth-mode="guest"'
          printf '%s' "$DOM" | grep -q 'auth-gate-hidden'
          printf '%s' "$DOM" | grep -q '<canvas'
          echo 'CUBE_PUBLIC_GUEST_SMOKE_PASS'
      - name: Local production-build WebMCP and responsive smoke in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/forgemcp-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          xvfb-run -a node scripts/chrome-webmcp-smoke.mjs
          xvfb-run -a node scripts/responsive-home-smoke.mjs
      - name: Public GitHub Pages clean-browser WebMCP smoke
        env:
          FORGEMCP_TARGET_URL: https://terraforming-planet.github.io/ForgeMCP-Multi-Agent-Research---Game-Studio/#/dashboard
        run: xvfb-run -a node scripts/chrome-webmcp-smoke.mjs
      - name: Public GitHub Pages responsive home smoke
        if: github.event_name != 'pull_request'
        env:
          FORGEMCP_HOME_URL: https://terraforming-planet.github.io/ForgeMCP-Multi-Agent-Research---Game-Studio/#/
        run: xvfb-run -a node scripts/responsive-home-smoke.mjs
